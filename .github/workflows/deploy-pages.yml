name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/testing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - name: Build for the Pages URL
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "${PAGES_BASE_PATH}/"
      - name: Verify production artifact
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs'
          const html = readFileSync('dist/index.html', 'utf8')
          if (html.includes('/src/main.tsx')) throw new Error('Unbuilt HTML in dist')
          const assets = [...html.matchAll(/(?:src|href)="([^"]*\/assets\/[^\"]+)"/g)]
          if (assets.length < 2) throw new Error('Missing production JS/CSS')
          for (const [, url] of assets) {
            if (!existsSync('dist/assets/' + url.split('/assets/')[1])) {
              throw new Error('Missing asset: ' + url)
            }
          }
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
